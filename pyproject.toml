[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telebirr-receipt"
version = "1.0.0"
description = "A Python library for fetching, parsing, and verifying Telebirr transaction receipts."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

authors = [
    {name = "Amare Misgana"}
]

keywords = [
    "telebirr",
    "ethiopia",
    "ethiotelecom",
    "payment",
    "receipt",
    "parser",
    "verification"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/telebirr-receipt"
Repository = "https://github.com/YOUR_USERNAME/telebirr-receipt"
Issues = "https://github.com/YOUR_USERNAME/telebirr-receipt/issues"

[tool.setuptools.packages.find]
where = ["."]